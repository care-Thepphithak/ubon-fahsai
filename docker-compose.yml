name: ubon-fahsai-dev

services:
  web:
    image: registry.gitlab.com/codespace8635531/ubon-fahsai:latest
    ports:
      - "80:3000"
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=dummy
    depends_on:
      - db
      - minio

  db:
    image: postgres:14
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database

  minio:
    image: minio/minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - database

networks:
  database:
    driver: bridge
  
volumes:
  postgres_data:
  minio_data: