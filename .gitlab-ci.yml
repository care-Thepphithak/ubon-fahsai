stages:
  - build
  - deploy

variables:
  IMAGE_NAME: "registry.gitlab.com/codespace8635531/ubon-fahsai"
  IMAGE_TAG: "latest"
  DEPLOY_DIR: "/home/ubon-fahsai/ubon-fahsai-dev"  # target folder on the Azure VM
  ENV_FILE: ".env.dev"                               # local copy of the environment file

build:
  stage: build
  image: docker:20.10.16
  services:
    - docker:dind
  script:
    - "docker login -u \"$DEPLOY_KEY_USERNAME\" -p \"$DEPLOY_KEY_PASSWORD\" registry.gitlab.com"
    - "docker build -t \"$IMAGE_NAME:$IMAGE_TAG\" ."
    - "docker push \"$IMAGE_NAME:$IMAGE_TAG\""
  only:
    - development

deploy:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:latest
  script:
    - apt-get update && apt-get install -y jq
    - echo "$AZURE_CREDENTIALS" | base64 --decode > azure_credentials.json
    - az login --service-principal --username "$(jq -r .clientId azure_credentials.json)" --password "$(jq -r .clientSecret azure_credentials.json)" --tenant "$(jq -r .tenantId azure_credentials.json)"
    - export DEPLOY_SCRIPT="docker system prune -f && docker login registry.gitlab.com -u ${DEPLOY_KEY_USERNAME} -p ${DEPLOY_KEY_PASSWORD} && cd ${DEPLOY_DIR} && docker-compose pull && docker-compose up -d"
    - az vm run-command invoke --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" --command-id RunShellScript --scripts "$DEPLOY_SCRIPT"
  only:
    - development
