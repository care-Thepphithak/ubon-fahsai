name: ubon-fahsai-local

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: ubon-fahsai-local
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ubon-fahsai-local
      POSTGRES_HOST: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database

  minio:
    image: minio/minio
    container_name: minio1
    environment:
      - MINIO_ROOT_USER=username
      - MINIO_ROOT_PASSWORD=password
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    command: server /data --console-address ":9001"
    user: "${UID}:${GID}"
    restart: unless-stopped
    networks:
      - database

networks:
  database:
    driver: bridge

volumes:
  postgres_data:
  minio_data: