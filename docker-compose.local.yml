name: ubon-fahsai-local

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: ubon-fahsai-local
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ubon-fahsai-local
      POSTGRES_HOST: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database

  minio:
    image: minio/minio
    environment:
      MINIO_ACCESS_KEY: minio-dev
      MINIO_SECRET_KEY: ubon-fahsai-local-key
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data

networks:
  database:
    driver: bridge

volumes:
  postgres_data:
  minio_data: