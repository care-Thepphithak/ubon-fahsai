name: ubon-fahsai-local

services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    environment:
      - SECRET_KEY_BASE=dummy
      - DATABASE_URL=postgresql://ubon-fahsai-local:postgres@db/ubon-fahsai-local
    volumes:
      - .:/myapp
    ports:
      - "3000:3000"
    networks:
      - database
    depends_on:
      - db

  db:
    image: postgres:14
    environment:
      POSTGRES_USER: ubon-fahsai-local
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ubon-fahsai-local
      POSTGRES_HOST: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database

networks:
  database:
    driver: bridge

volumes:
  postgres_data: