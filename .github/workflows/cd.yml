name: Continuous Deployment

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitLab Registry
        uses: docker/login-action@v1
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.DEPLOY_KEY_USERNAME }}
          password: ${{ secrets.DEPLOY_KEY_PASSWORD }}

      - name: Prepare environment file
        run: cp ${PRODUCTION_ENV_FILE} .env.dev

      - name: Build Docker image
        run: |
          docker build -t registry.gitlab.com/codespace8635531/ubon-fahsai:latest .

      - name: Push Docker image to GitLab Registry
        run: |
          docker push registry.gitlab.com/codespace8635531/ubon-fahsai:latest

      - name: Decode Azure Credentials
        run: |
          echo "${{ secrets.AZURE_CREDENTIALS }}" | base64 --decode > azure_credentials.json

      - name: Deploy to Azure VM using docker-compose
        uses: azure/cli@v1
        with:
          inlineScript: |
            az login --service-principal --username "$(jq -r .clientId azure_credentials.json)" \
              --password "$(jq -r .clientSecret azure_credentials.json)" \
              --tenant "$(jq -r .tenantId azure_credentials.json)"

            az vm run-command invoke \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --name ${{ secrets.VM_NAME }} \
              --command-id RunShellScript \
              --scripts "docker system prune -f && docker login registry.gitlab.com -u ${DEPLOY_KEY_USERNAME} -p ${DEPLOY_KEY_PASSWORD} && cd /home/ubon-fahsai/ubon-fahsai-dev && docker-compose pull && docker-compose --env-file .env.dev up -d"
